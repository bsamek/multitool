[project]
name = "multitool"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "llm>=0.28",
    "llm-anthropic>=0.23",
    "llm-gemini>=0.28.2",
    "textual>=7.0.1",
    "textual-autocomplete>=4.0.6",
]

[project.scripts]
multitool = "app:main"

[tool.setuptools]
py-modules = ["app"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
]

[tool.pytest.ini_options]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=100"
